services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    restart: unless-stopped

  # HTTPS in front of the api: gets and renews the Let's Encrypt certificate automatically.
  caddy:
    image: caddy:2.10
    command: caddy reverse-proxy --from ${DOMAIN:?DOMAIN must be set in .env} --to api:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
